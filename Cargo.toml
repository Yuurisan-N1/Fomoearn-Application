[package]
name = "fomoearn-bot"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Watch and earn automation client for the FomoEarn task feed"

[[bin]]
name = "fomoearn-bot"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono = "0.4"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
